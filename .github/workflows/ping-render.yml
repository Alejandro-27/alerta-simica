name: Mantener Render despierto

on:
  schedule:
    # Una vez por hora, fuera del minuto cero (menos congestión en GitHub).
    # Cada ejecución hace un bucle de pings cada 10 min para cubrir el hueco
    # entre ejecuciones: GitHub retrasa/colapsa los crons en repos de baja actividad.
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    # Máximo permitido en runners de GitHub (6 h). Deja margen para el arranque.
    timeout-minutes: 360
    steps:
      - name: Ping /api/health cada 10 minutos
        env:
          URL: https://alertasimica-backend.onrender.com/api/health
        run: |
          set -u
          START=$(date +%s)
          DEADLINE=$((START + 350 * 60))
          n=0
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            n=$((n + 1))
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              --connect-timeout 30 --max-time 90 --retry 2 --retry-delay 20 \
              "$URL" || echo 000)
            printf '%s  ping #%s -> HTTP %s\n' "$(date -u +%H:%M:%S)" "$n" "$code"
            sleep 600
          done
          echo "Bucle terminado tras $n pings."
