<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sin conexión — AlertaSísmica</title>
    <meta name="theme-color" content="#0b1220" />
    <style>
      body {
        margin: 0;
        background: #0b1220;
        color: #e2e8f0;
        font-family: system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 420px;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 8px;
        color: #f59e0b;
      }
      p {
        color: #94a3b8;
        line-height: 1.6;
      }
      button {
        margin-top: 16px;
        background: #f59e0b;
        color: #0b1220;
        border: 0;
        border-radius: 8px;
        padding: 12px 24px;
        font-weight: 600;
        cursor: pointer;
      }
      .note {
        font-size: 0.85rem;
        margin-top: 24px;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Sin conexión</h1>
      <p>No hay conexión a internet. La última información disponible sigue guardada en tu dispositivo.</p>
      <button onclick="location.reload()">Reintentar</button>
      <p class="note">AlertaSísmica no simula datos nuevos cuando estás sin conexión.</p>
    </div>
  </body>
</html>
